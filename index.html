  <meta name="theme-color" content="#0b0806" />
  <title>Flashcardsish</title>
  <style>
    :root {
      --bg: #0b0806;
      --panel: #14100c;
      --panel-2: #1b1611;
      --text: #f5f3ef;
      --muted: #cfc2a5;
      --accent: #d0a45e;
      --red: #e57373;
      --green: #93d26c;
      --green: #93d26c;
      --yellow: #f5c16c;
      --blue: #64b5f6;
      --purple: #ba68c8;
      --outline: #3b2f22;
    }

    .light-mode {
      --bg: #f5f3ef;
      --panel: #e8e6e1;
      --panel-2: #dcd9d2;
      --text: #1e1913;
      --muted: #8a8170;
      --accent: #b08845;
      --red: #d32f2f;
      --green: #388e3c;
      --green: #388e3c;
      --yellow: #fbc02d;
      --blue: #1976d2;
      --purple: #7b1fa2;
      --outline: #ccc5b9;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      transition: background-color 0.3s, color 0.3s;
    }

    /* Custom scrollbar for textareas */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--panel);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--outline);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }

    /* Flip Card Styles */
    .perspective-1000 {
      perspective: 1000px;
    }

    .transform-style-3d {
      transform-style: preserve-3d;
    }

    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .rotate-y-180 {
      transform: rotateY(180deg);
    }

    .rotate-x-180 {
      transform: rotateX(180deg);
    }
  </style>
